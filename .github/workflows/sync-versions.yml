name: Sync versions

# Once a day, set each project's version in README.md to its latest release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # shell: bash adds pipefail, so a failing script still fails the step through tee.
        shell: bash
        run: python3 scripts/sync_versions.py | tee "$RUNNER_TEMP/changes.txt"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "Stiven Gjekaj"
          git config user.email "stivenagostingjekaj@gmail.com"
          git commit -am "Update project versions" -m "$(cat "$RUNNER_TEMP/changes.txt")"
          git push
